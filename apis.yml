aid: aizon
name: Aizon
description: >-
  Aizon is a B2B SaaS manufacturing-intelligence platform for GxP pharmaceutical
  manufacturers and CDMOs. It turns process data into AI-driven recommendations to
  increase yield, reduce deviations, and prevent batch loss without replacing
  existing MES, LIMS, ERP, or historian systems. The platform spans four connected
  products: Aizon Execute (intelligent electronic batch records), Aizon Unify (a
  GxP manufacturing data platform / lakehouse), Aizon Predict (operationalized ML
  for yield optimization, CPV, and predictive quality), and Aizon Agentic Studio (a
  natural-language application and dashboard builder). Aizon runs single-tenant on
  AWS with ALCOA++ data integrity, 21 CFR Part 11 e-signatures, and a GxP model
  lifecycle, and exposes a RESTful API to customers. Offices in San Francisco, USA
  and Barcelona, Spain.
